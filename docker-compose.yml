services:
  # Layanan 1: Ingestion Serial dan Konversi Data
  gateway-bridge:
    build: .
    container_name: unib_gateway_bridge
    restart: unless-stopped
    # Catatan: Aktifkan baris devices di bawah ini jika menggunakan ESP32 fisik di Linux
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - SERIAL_PORT=socket://host.docker.internal:5555
      - MQTT_HOST=local-broker
      - MQTT_PORT=1883
    depends_on:
      - local-broker
    volumes:
      - buffer-data:/app/data

  # Layanan 2: Broker MQTT Lokal (Eclipse Mosquitto)
  local-broker:
    image: eclipse-mosquitto:2.0
    container_name: unib_local_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data

volumes:
  buffer-data:
  mosquitto-data:
